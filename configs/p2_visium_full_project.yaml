# Formal REVISE full delivery; analysis parameters are owned here.
schema_version: 1
output_dir: ../output/full-acceptance/sST/batch
samples:
- ../../REVISE/results/acceptance-full/P2CRC_Visium/default/sample.yaml
analyses:
  reconstruction_impact:
    scopes:
    - All
    - Fibroblast
    - Mono_Macro
    - T
    random_state: 42
    anatomy_window_side_microns: 40.0
    window_side_microns: 40.0
    min_window_units: 4
    n_window_draws: 200
    region_n_bootstrap: 500
    sample_n_units: 30000
    geneset_path: ../resources/h.all.v2025.1.Hs.symbols.gmt
    gene_set_names: &id001
    - HALLMARK_EPITHELIAL_MESENCHYMAL_TRANSITION
    pathway_auc_threshold: 0.01
    membership_same_units: false
  spatial_autocorrelation:
    moran_n_neighbors: 6
    random_state: 42
  pathway_activity:
    geneset_path: ../resources/h.all.v2025.1.Hs.symbols.gmt
    gene_set_names: *id001
    pathway_auc_threshold: 0.01
    random_state: 42
