[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revise-analysis-agent"
version = "0.1.0"
description = "Independent Raw/SVC analysis, scientific notebooks and saved-result reports"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "anndata>=0.10,<0.13", "numpy>=1.24,<3", "pandas>=2,<3",
  "scipy>=1.10,<2", "PyYAML>=6", "matplotlib>=3.7", "scikit-learn>=1.3",
  "scanpy>=1.10,<1.12", "igraph>=0.11", "leidenalg>=0.10", "scikit-misc>=0.3",
  "statsmodels>=0.14", "scikit-image>=0.20", "seaborn>=0.12"
]

[project.optional-dependencies]
pathway = ["omicverse==1.7.5", "gseapy", "networkx", "torch", "torch-geometric", "setuptools<81", "transformers<5"]
cci = ["cellphonedb>=5,<6"]
trajectory = ["omicverse==1.7.5", "torch", "torch-geometric", "setuptools<81", "transformers<5"]
spatial = ["squidpy>=1.2"]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
revise-analysis = "revise_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["revise_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
